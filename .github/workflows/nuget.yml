name: nuget

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Package version = <VersionPrefix> in Directory.Build.props.
      # Bump it manually to release a new version; the -dev suffix is
      # cleared so the package is published as a stable version.
      # If the version already exists on nuget.org, push is skipped
      # by --skip-duplicate.
      - name: Read project version
        id: ver
        run: |
          set -euo pipefail
          BASE=$(sed -n 's/.*<VersionPrefix>\([^<]*\)<\/VersionPrefix>.*/\1/p' Directory.Build.props | head -1)
          echo "version=${BASE}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${BASE}"

      - name: Build
        run: dotnet build Hazel.sln -c Release --nologo

      - name: Pack
        run: dotnet pack Hazel.sln -c Release -p:VersionSuffix= -o artifacts --no-build --nologo

      # Trusted publishing: exchanges the GitHub OIDC token for a short-lived
      # nuget.org API key tied to the policy (no secret needed).
      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ELinmei

      - name: Push to nuget.org
        run: |
          set -euo pipefail
          ls -la artifacts
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "artifacts/*.snupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate || true
